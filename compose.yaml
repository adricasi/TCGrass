# TCGrass: Caddy (HTTPS) → API (serves /api, card art and the PWA) → SQLite on ${DATA_DIR}.
# Usage: cp .env.example .env, fill it in, then `docker compose up -d --build` (NFR-011).
# Local Ollama on the host: add `-f compose.yaml -f compose.local.yaml` (docs/deploy.md).
name: tcgrass

# Rotated container logs, so a request flood can't fill the boot disk.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  api:
    build: .
    # Local: built from source (`--build`). Production: the registry image the deploy agent
    # pulls (API_IMAGE, ADR 0008).
    image: ${API_IMAGE:-tcgrass-api}
    restart: unless-stopped
    # Inference settings and caps. Only this service gets the file (it holds INFERENCE_API_KEY).
    env_file: .env
    # Fixed by the stack, whatever .env says.
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/tcgrass.db
      LOG_FILE_PATH: /data/logs/api.log
      # Caddy is the only way in (the port below is not published), so X-Forwarded-For is ours.
      TRUST_PROXY: "true"
    volumes:
      # Must be writable by uid 1000 (the image's `node` user).
      - ${DATA_DIR:?set DATA_DIR in .env}:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    logging: *logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      # Probe every 2 s during start_period so Caddy starts promptly (Docker Engine 25+).
      start_interval: 2s
      retries: 3

  caddy:
    # Pinned by digest so a rebuild or rollback gets the same Caddy; bump tag and digest together.
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 256
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Certificates and ACME account; keep across redeploys to stay clear of Let's Encrypt limits.
  caddy_data:
  caddy_config:
