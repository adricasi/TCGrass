name: deploy

# Releases (ADR 0008), private-repository mode:
# - every push to main builds the image and pushes tcgrass-api:sha-<commit> to DigitalOcean
#   Container Registry, with SBOM and provenance attestations;
# - a release happens only when the operator runs this workflow by hand on main ("Run workflow"):
#   that click is the approval. It points :prod at the chosen commit's image; the Droplet's deploy
#   agent notices within a minute and deploys it by digest. GitHub never connects to the Droplet.
# Rollback: "Run workflow" with an older commit of main. During the field test: don't run it.
#
# The DO token (DO_REGISTRY_TOKEN) is a REPOSITORY secret here, because GitHub Free has no environment
# secrets or required reviewers for private repositories. Before making the repository public,
# switch back to environment secrets with a required reviewer (docs/deploy.md § 2e).
# DO_REGISTRY_USERNAME is no longer used.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full SHA of a commit on main to release (its image must exist). Empty = latest main."
        required: false
        default: ""

permissions:
  contents: read

env:
  REGISTRY: registry.digitalocean.com
  IMAGE: registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/tcgrass-api

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Private mode only (repository secrets, manual release). If the repository is made public,
      # stop until the environment-gated workflow replaces this one (docs/deploy.md § 2e).
      - name: Refuse to run in a public repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPO_PRIVATE" != "true" ]]; then
            echo "deploy.yml is in private mode but the repository is public: switch to the environment-gated workflow first" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # DigitalOcean's official action installs doctl (pinned); no_auth keeps the DO token out of any
      # config file. `doctl registry login` reads the token from the environment and stores
      # registry credentials that expire in 25 minutes (longer than the job's 20-minute timeout,
      # since BuildKit authenticates again at push time), so nothing long-lived lands on the runner.
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          version: 1.175.0
          no_auth: true
      - name: Log in to DigitalOcean Container Registry (short-lived)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_REGISTRY_TOKEN }}
        run: doctl registry login --expiry-seconds 1500
      # Attestations need the docker-container driver; the result is an OCI index, which the
      # Droplet's agent resolves to a digest.
      - name: Set up the image builder
        # BuildKit pinned by version and digest: it builds the production image and receives the
        # push credentials, so it must not be a moving tag.
        run: >-
          docker buildx create --name release --driver docker-container --use
          --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build and push sha-${{ github.sha }}
        run: >-
          docker buildx build --pull --push
          --platform linux/amd64
          --provenance=mode=max --sbom=true
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$IMAGE:sha-$GITHUB_SHA" .
      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"

  release:
    # Only by hand, and only from main's workflow definition.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer pending release replaces an older one; builds are never blocked by releases.
    concurrency:
      group: release-prod
      cancel-in-progress: false
    steps:
      # Private mode only (repository secrets, manual release). If the repository is made public,
      # stop until the environment-gated workflow replaces this one (docs/deploy.md § 2e).
      - name: Refuse to run in a public repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPO_PRIVATE" != "true" ]]; then
            echo "deploy.yml is in private mode but the repository is public: switch to the environment-gated workflow first" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose the commit (must be on main)
        id: commit
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          commit="${INPUT_COMMIT:-$GITHUB_SHA}"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" "$GITHUB_SHA"; then
            echo "$commit is not on main" >&2
            exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
      # DigitalOcean's official action installs doctl (pinned); no_auth keeps the DO token out of any
      # config file. `doctl registry login` reads the token from the environment and stores
      # registry credentials that expire in 15 minutes, so nothing long-lived lands on the runner.
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          version: 1.175.0
          no_auth: true
      - name: Log in to DigitalOcean Container Registry (short-lived)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_REGISTRY_TOKEN }}
        run: doctl registry login --expiry-seconds 900
      - name: Point :prod at sha-${{ steps.commit.outputs.sha }}
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        # Copies the index in the registry; nothing is rebuilt, and the digest stays the same.
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:sha-$SHA" >/dev/null 2>&1; then
            echo "no image for $SHA yet: wait for its build job to finish" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:sha-$SHA"
          docker buildx imagetools inspect "$IMAGE:prod" --format '{{json .Manifest}}' | jq -r '"released digest: \(.digest)"'
      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"
